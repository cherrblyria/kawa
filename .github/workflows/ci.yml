name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*.*.*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.14

      - name: Install project (with dev deps)
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Smoke test
        run: |
          uv run kawa mc ntow 10 20
          uv run kawa mc ownt 80 160
          uv run kawa mc item 128 to-stack
          uv run kawa mc ntow -5 -3
          uv run kawa uwuify The quick brown fox jumps over the lazy dog
          uv run kawa coinflip
          uv run kawa coinflip --plain
          echo '{"a": 1}' | uv run kawa json pretty -

  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.14

      - name: Install project (with dev deps)
        run: uv sync --dev

      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Piped smoke test
        run: uv run kawa mc ntow 1 2 | Select-Object -First 1
        shell: pwsh

  build-check:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.14

      - name: Install project (with dev deps)
        run: uv sync --dev

      - name: Build binary
        run: uv run pyinstaller kawa.spec

      - name: Sanity-run built binary
        run: ./dist/kawa mc ntow 10 20
